[vpn_server]
vpn01 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/ansible_docker_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[vpn_client]
client01 ansible_host=127.0.0.1 ansible_port=2223 ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/ansible_docker_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[vpn_server:vars]
ansible_python_interpreter=/usr/bin/python3
mode_auth=rsa
vpn_interface=eth0
vpn_subnet=10.10.0.0/24
vpn_gateway=10.10.0.1

[vpn_client:vars]
ansible_python_interpreter=/usr/bin/python3
